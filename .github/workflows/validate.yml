name: Validate skills

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      # Strict YAML frontmatter, spec naming rules, README links, plugin manifests.
      # Claude Code tolerates bad YAML; the skills CLI silently skips the skill.
      - run: uv run scripts/validate_skills.py
